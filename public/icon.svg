<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="darkBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#EAB308" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background badge for contrast on dark/light tabs -->
  <circle cx="32" cy="32" r="30" fill="#0B132B" stroke="url(#goldGrad)" stroke-width="2"/>
  <g filter="url(#glow)">
    <!-- Trophy handles -->
    <path d="M16 18C10 18 8 26 12 33C15 38 19 40 23 41" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M48 18C54 18 56 26 52 33C49 38 45 40 41 41" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Trophy cup body -->
    <path d="M20 14H44C44 14 46 31 35 37.5C33.5 38.5 30.5 38.5 29 37.5C18 31 20 14 20 14Z" fill="url(#goldGrad)"/>
    <!-- Highlight shine -->
    <path d="M23 17H26C26 17 26.5 28 24.5 31" stroke="#FEF08A" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    <!-- Stem -->
    <rect x="29" y="38" width="6" height="9" fill="url(#goldGrad)" rx="1"/>
    <!-- Base -->
    <path d="M23 47H41L43 53H21L23 47Z" fill="url(#darkBase)" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <rect x="19" y="53" width="26" height="4" fill="url(#goldGrad)" rx="1.5"/>
    <!-- Star on trophy -->
    <polygon points="32,21 33.2,24.5 37,24.5 34,26.8 35.2,30.2 32,28.2 28.8,30.2 30,26.8 27,24.5 30.8,24.5" fill="#FFFFFF"/>
  </g>
</svg>
